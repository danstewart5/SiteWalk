<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SiteWalk — Camera Walk</title>
  <style>
    :root {
      --bg: #f3efe6;
      --surface: #fffcf7;
      --ink: #1c1917;
      --muted: #6b645c;
      --faint: #9a938a;
      --line: #e0d9ce;
      --navy: #1f4e79;
      --navy-fg: #f7f4ee;
      --warn: #8a5a12;
      --warn-bg: #f6ead3;
      --danger: #9b2c2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      max-width: 480px;
      margin-inline: auto;
      padding: 16px 16px 40px;
    }
    h1 { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0; }
    h2 { font-size: 22px; margin: 4px 0 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .rec { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
    @media (prefers-reduced-motion: no-preference) {
      .dot { animation: pulse 1.2s ease-in-out infinite; }
    }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
    .warn { background: var(--warn-bg); color: var(--warn); border-color: #e4d2a8; }
    .stage {
      background: #1c1917;
      color: var(--navy-fg);
      border-radius: 16px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      overflow: hidden;
      cursor: pointer;
    }
    video { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: none; }
    video.on { display: block; }
    .shutter {
      width: 80px; height: 80px; border-radius: 50%;
      border: 4px solid var(--ink); background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      margin: 16px auto 0; cursor: pointer; font-size: 28px;
    }
    button, .btn {
      min-height: 44px; border: 0; border-radius: 10px; padding: 0 16px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .primary { background: var(--navy); color: var(--navy-fg); width: 100%; }
    .danger { background: var(--danger); color: #fff; }
    .muted { color: var(--muted); font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--faint); }
    .film { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; }
    .film img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .shot img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  </style>
</head>
<body>
  <h1>SiteWalk</h1>
  <h2>Camera walk</h2>
  <div id="idle">
    <div class="card">
      <p class="muted">Start a walk, then tap the shutter. Each photo saves on this phone with time and GPS. No Grok login.</p>
      <button class="primary" id="start">Start recording walk</button>
    </div>
  </div>
  <div id="rec" hidden>
    <div class="row">
      <div class="rec"><span class="dot"></span><div><strong>Recording</strong><div class="mono" id="meta">00:00:00 · 0 photos</div></div></div>
      <button class="danger" id="end">End walk</button>
    </div>
    <div class="card warn" id="camMsg" hidden></div>
    <label class="stage" for="cam" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <div id="placeholder">📷<div>Tap to open camera</div></div>
    </label>
    <p class="mono" id="gps">Waiting for GPS…</p>
    <input id="cam" type="file" accept="image/*" capture="environment" />
    <label class="shutter" for="cam" id="shutter" title="Take photo">📷</label>
    <p class="muted" id="hint" style="text-align:center">Tap the shutter. Photo saves to this walk.</p>
    <div class="film" id="film"></div>
    <div id="shots"></div>
  </div>

<script>
const KEY = "sitewalk-walk-v1";
const idle = document.getElementById("idle");
const rec = document.getElementById("rec");
const video = document.getElementById("video");
const placeholder = document.getElementById("placeholder");
const camMsg = document.getElementById("camMsg");
const meta = document.getElementById("meta");
const gpsEl = document.getElementById("gps");
const film = document.getElementById("film");
const shots = document.getElementById("shots");
const cam = document.getElementById("cam");
const hint = document.getElementById("hint");
const shutter = document.getElementById("shutter");

let state = { active: false, startedAt: null, notes: [], live: false, stream: null, coords: null, watch: null, timer: null };

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); state.notes = s.notes || []; } catch {}
}
function save() { localStorage.setItem(KEY, JSON.stringify({ notes: state.notes })); }

function inIframe() { try { return window.self !== window.top; } catch { return true; } }

function showCam(msg) {
  if (!msg) { camMsg.hidden = true; return; }
  camMsg.hidden = false;
  camMsg.textContent = msg;
}

function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = String(Math.floor(s / 3600)).padStart(2, "0");
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const sec = String(s % 60).padStart(2, "0");
  return h + ":" + m + ":" + sec;
}

function render() {
  const n = state.notes.filter(x => x.photo).length;
  meta.textContent = (state.active && state.startedAt ? fmt(Date.now() - state.startedAt) : "00:00:00") + " · " + n + " photo" + (n === 1 ? "" : "s");
  film.innerHTML = [...state.notes].reverse().map(x => x.photo ? `<img src="${x.photo}" alt="">` : "").join("");
  shots.innerHTML = [...state.notes].reverse().map(x => `
    <div class="card shot">
      <div class="row"><span>${x.body}</span><span class="mono">${new Date(x.createdAt).toLocaleString()}</span></div>
      ${x.photo ? `<img src="${x.photo}" alt="">` : ""}
      ${x.lat != null ? `<div class="mono">${x.lat.toFixed(5)}, ${x.lng.toFixed(5)}</div>` : ""}
    </div>`).join("");
}

function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 960 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = reject;
    img.src = url;
  });
}

function addShot(dataUrl) {
  state.notes.push({
    body: "Photo " + (state.notes.length + 1),
    photo: dataUrl,
    lat: state.coords?.lat ?? null,
    lng: state.coords?.lng ?? null,
    createdAt: new Date().toISOString(),
  });
  save();
  render();
}

function snapLive() {
  if (!state.live || !video.videoWidth) return false;
  const max = 960;
  const scale = Math.min(1, max / Math.max(video.videoWidth, video.videoHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(video.videoWidth * scale);
  c.height = Math.round(video.videoHeight * scale);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  addShot(c.toDataURL("image/jpeg", 0.72));
  return true;
}

async function startCam() {
  if (!window.isSecureContext) {
    showCam("Live camera needs HTTPS. Tap the shutter to take a photo — the walk is still recording.");
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    showCam(inIframe()
      ? "This preview blocks the live camera. Walk is still recording — tap the shutter."
      : "No live camera on this device. Tap the shutter to take a photo.");
    return;
  }
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    video.srcObject = state.stream;
    await video.play();
    video.classList.add("on");
    placeholder.hidden = true;
    state.live = true;
    shutter.removeAttribute("for");
    showCam("");
    hint.textContent = "Live camera on. Tap the shutter to save a shot.";
  } catch (err) {
    state.live = false;
    const name = err && err.name;
    if (inIframe()) showCam("This preview blocks the live camera. Walk is still recording — tap the shutter to take photos.");
    else if (name === "NotAllowedError" || name === "PermissionDeniedError") showCam("Camera permission denied. Tap the shutter to use your phone camera instead.");
    else showCam("Live camera unavailable. Tap the shutter — photos still save to this walk.");
  }
}

function stopCam() {
  state.stream?.getTracks().forEach(t => t.stop());
  state.stream = null;
  state.live = false;
  video.srcObject = null;
  video.classList.remove("on");
  placeholder.hidden = false;
  shutter.setAttribute("for", "cam");
}

function startGps() {
  if (!navigator.geolocation) { gpsEl.textContent = "GPS off"; return; }
  state.watch = navigator.geolocation.watchPosition(
    p => {
      state.coords = { lat: p.coords.latitude, lng: p.coords.longitude };
      gpsEl.textContent = p.coords.latitude.toFixed(5) + ", " + p.coords.longitude.toFixed(5);
    },
    e => { gpsEl.textContent = e.message || "GPS unavailable"; },
    { enableHighAccuracy: true, maximumAge: 8000, timeout: 12000 }
  );
}

document.getElementById("start").onclick = () => {
  state.active = true;
  state.startedAt = Date.now();
  idle.hidden = true;
  rec.hidden = false;
  startCam();
  startGps();
  state.timer = setInterval(render, 1000);
  render();
};
document.getElementById("end").onclick = () => {
  state.active = false;
  clearInterval(state.timer);
  if (state.watch != null) navigator.geolocation.clearWatch(state.watch);
  stopCam();
  idle.hidden = false;
  rec.hidden = true;
};
shutter.onclick = (e) => {
  if (state.live) {
    e.preventDefault();
    snapLive();
  }
};
cam.onchange = async (e) => {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file) return;
  hint.textContent = "Saving photo…";
  try { addShot(await compress(file)); hint.textContent = "Photo saved. Tap again for the next one."; }
  catch { hint.textContent = "Could not save that photo. Try again."; }
};

load();
render();
</script>
</body>
</html>
