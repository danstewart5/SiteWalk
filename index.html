<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SiteWalk - Simple Walk Tool</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; background: #f0f2f5; color: #1a1a1a; }
.container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
h1 { color: #1a365d; margin: 0 0 8px 0; font-size: 24px; }
.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
.section { margin: 16px 0; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fafafa; }
button { background: #2b6cb0; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; margin: 6px 0; cursor: pointer; width: 100%; }
button:active { opacity: 0.85; }
button:disabled { background: #a0aec0; }
button.green { background: #38a169; }
.status { padding: 12px; border-radius: 6px; margin: 10px 0; font-size: 14px; }
.status.ok { background: #c6f6d5; color: #276749; }
.status.err { background: #fed7d7; color: #c53030; }
.status.info { background: #ebf8ff; color: #2b6cb0; }
#photos, #videos, #notes { margin-top: 10px; }
img, video { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
#report { background: #edf2f7; padding: 16px; border-radius: 8px; margin-top: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="container">
<h1>📍 SiteWalk</h1>
<p class="subtitle">Walk • Talk • Snap • Report</p>

<div class="section">
<h2>🎥 AI Walk-Around</h2>
<button id="walkBtn" class="green">Start Walk-Around (Voice + Camera)</button>
<div id="walkStatus" class="status info">Tap to start. Your phone will ask for camera and mic permission.</div>
</div>

<div class="section">
<h2>📷 Photos</h2>
<button id="photoBtn">Take Photo</button>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
<div id="photos"></div>
</div>

<div class="section">
<h2>🎬 Video</h2>
<button id="vidStart">Start Video</button>
<button id="vidStop" disabled>Stop Video</button>
<div id="vidPrev"></div>
</div>

<div class="section">
<h2>🎤 Voice Notes</h2>
<button id="startBtn">Start Recording</button>
<button id="stopBtn" disabled>Stop</button>
<div id="notes"></div>
</div>

<div class="section">
<h2>📋 Report</h2>
<button id="genBtn" class="green">Generate Clean Report</button>
<div id="report"></div>
</div>
</div>

<script>
let photos = [], notes = [], videos = [];
let mediaRec, audioChunks = [];
let vidRec, vidChunks = [];

// Walk-Around: starts camera + voice together
window.startWalk = function() {
  const status = document.getElementById('walkStatus');
  status.className = 'status info';
  status.textContent = 'Starting camera and mic...';
  
  // Start camera
  document.getElementById('photoInput').click();
  
  // Start voice after short delay
  setTimeout(function() {
    document.getElementById('startBtn').click();
  }, 800);
  
  status.className = 'status ok';
  status.textContent = '🔴 Walk-Around active. Take photos and speak notes.';
};

document.getElementById('walkBtn').addEventListener('click', window.startWalk);

// Photos with forced rear camera
window.takePhoto = function() {
  document.getElementById('photoInput').click();
};
document.getElementById('photoBtn').addEventListener('click', window.takePhoto);

document.getElementById('photoInput').addEventListener('change', function(e) {
  const files = e.target.files;
  if (!files || !files.length) return;
  for (let f of files) {
    const r = new FileReader();
    r.onload = function(ev) {
      photos.push(ev.target.result);
      const img = document.createElement('img');
      img.src = ev.target.result;
      document.getElementById('photos').appendChild(img);
      document.getElementById('walkStatus').className = 'status ok';
      document.getElementById('walkStatus').textContent = 'Photo added (' + photos.length + ' total).';
    };
    r.readAsDataURL(f);
  }
  e.target.value = '';
});

// Video with forced rear camera
window.startVideo = function() {
  const status = document.getElementById('walkStatus');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.className = 'status err';
    status.textContent = 'Camera not supported. Try Chrome.';
    return;
  }
  status.className = 'status info';
  status.textContent = 'Requesting camera + mic...';
  navigator.mediaDevices.getUserMedia({ 
    video: { facingMode: 'environment' }, 
    audio: true 
  })
    .then(function(stream) {
      const v = document.createElement('video');
      v.srcObject = stream;
      v.autoplay = true;
      v.muted = true;
      v.playsInline = true;
      v.style.cssText = 'max-width:100%;border-radius:8px;margin:10px 0;';
      document.getElementById('vidPrev').innerHTML = '';
      document.getElementById('vidPrev').appendChild(v);
      
      vidRec = new MediaRecorder(stream);
      vidChunks = [];
      vidRec.ondataavailable = function(e) { vidChunks.push(e.data); };
      vidRec.onstop = function() {
        const b = new Blob(vidChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(b);
        v.srcObject = null;
        v.src = url;
        v.controls = true;
        v.muted = false;
        stream.getTracks().forEach(t => t.stop());
        videos.push(url);
        status.className = 'status ok';
        status.textContent = 'Video recorded.';
      };
      vidRec.start();
      document.getElementById('vidStart').disabled = true;
      document.getElementById('vidStop').disabled = false;
      status.className = 'status ok';
      status.textContent = '🔴 Recording video...';
    })
    .catch(function(err) {
      status.className = 'status err';
      status.textContent = 'Camera blocked: ' + (err.message || err.name) + '. Check phone settings.';
    });
};
document.getElementById('vidStart').addEventListener('click', window.startVideo);

window.stopVideo = function() {
  if (vidRec && vidRec.state !== 'inactive') {
    vidRec.stop();
    document.getElementById('vidStart').disabled = false;
    document.getElementById('vidStop').disabled = true;
  }
};
document.getElementById('vidStop').addEventListener('click', window.stopVideo);

// Voice recording
window.startVoice = function() {
  const status = document.getElementById('walkStatus');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.className = 'status err';
    status.textContent = 'Mic not supported. Try Chrome.';
    return;
  }
  status.className = 'status info';
  status.textContent = 'Requesting microphone...';
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(stream) {
      mediaRec = new MediaRecorder(stream);
      audioChunks = [];
      mediaRec.ondataavailable = function(e) { audioChunks.push(e.data); };
      mediaRec.onstop = function() {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        const div = document.createElement('div');
        div.innerHTML = '<audio controls src="' + url + '"></audio>';
        document.getElementById('notes').appendChild(div);
        notes.push('Voice note recorded');
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRec.start();
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      status.className = 'status ok';
      status.textContent = '🔴 Recording voice...';
    })
    .catch(function(err) {
      status.className = 'status err';
      status.textContent = 'Mic blocked: ' + (err.message || err.name);
    });
};
document.getElementById('startBtn').addEventListener('click', window.startVoice);

window.stopVoice = function() {
  if (mediaRec && mediaRec.state !== 'inactive') {
    mediaRec.stop();
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  }
};
document.getElementById('stopBtn').addEventListener('click', window.stopVoice);

// Generate report
window.generateReport = function() {
  let html = '<strong>📋 SiteWalk Report</strong><br><br>';
  html += '<strong>Photos:</strong> ' + photos.length + '<br>';
  html += '<strong>Voice Notes:</strong> ' + notes.length + '<br>';
  html += '<strong>Videos:</strong> ' + videos.length + '<br><br>';
  if (notes.length) html += '<strong>Notes:</strong><br>' + notes.join('<br>') + '<br><br>';
  html += '<em>Generated ' + new Date().toLocaleString() + '</em>';
  document.getElementById('report').innerHTML = html;
};
document.getElementById('genBtn').addEventListener('click', window.generateReport);

// Boot
window.addEventListener('load', function() {
  document.getElementById('walkStatus').textContent = 'Ready. Tap Start Walk-Around to begin.';
});
</script>
</body>
</html>
