<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SiteWalk</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 0 auto; padding: 12px; background: #f0f2f5; color: #1a1a1a; }
.container { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
h1 { color: #1a365d; margin: 0 0 4px 0; font-size: 22px; }
.subtitle { color: #666; font-size: 13px; margin-bottom: 16px; }
.section { margin: 12px 0; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fafafa; }
h2 { margin: 0 0 10px 0; font-size: 16px; color: #2d3748; }
button { background: #2b6cb0; color: white; border: none; padding: 13px 16px; border-radius: 8px; font-size: 15px; margin: 5px 0; cursor: pointer; width: 100%; }
button:active { opacity: 0.85; }
button:disabled { background: #a0aec0; }
button.green { background: #38a169; }
button.orange { background: #dd6b20; }
button.gray { background: #718096; }
.status { padding: 10px; border-radius: 6px; margin: 8px 0; font-size: 13px; }
.status.ok { background: #c6f6d5; color: #276749; }
.status.err { background: #fed7d7; color: #c53030; }
.status.info { background: #ebf8ff; color: #2b6cb0; }
select, input[type=text], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; margin: 6px 0; }
.photo-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; margin: 8px 0; }
.photo-card img { max-width: 100%; border-radius: 6px; display: block; }
.trade-tag { display: inline-block; background: #2b6cb0; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
#report { background: white; padding: 16px; border-radius: 8px; margin-top: 12px; border: 1px solid #e2e8f0; }
.report-section { margin: 16px 0; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
.report-section h3 { margin: 0 0 8px 0; color: #1a365d; font-size: 15px; }
.report-section img { max-width: 100%; border-radius: 6px; margin: 6px 0; }
.punch-item { padding: 6px 0; border-bottom: 1px dashed #e2e8f0; font-size: 14px; }
@media print {
  body { background: white; padding: 0; }
  .container { box-shadow: none; }
  button, .section:not(#reportSection), #walkStatus, .subtitle { display: none !important; }
  #reportSection { display: block !important; border: none; }
}
</style>
</head>
<body>
<div class="container">
<h1>📍 SiteWalk</h1>
<p class="subtitle">Walk • Talk • Snap • Report by Trade</p>

<div class="section">
<h2>🎥 Walk-Around</h2>
<button id="walkBtn" class="green">Start Walk-Around</button>
<div id="walkStatus" class="status info">Ready. Tap to begin.</div>
</div>

<div class="section">
<h2>📷 Photos + Trade Tag</h2>
<select id="tradeSelect">
  <option value="General">General</option>
  <option value="Plumbing">Plumbing</option>
  <option value="Electrical">Electrical</option>
  <option value="Framing">Framing</option>
  <option value="Drywall">Drywall</option>
  <option value="Roofing">Roofing</option>
  <option value="Concrete">Concrete</option>
  <option value="Landscaping">Landscaping</option>
  <option value="Other">Other</option>
</select>
<button id="photoBtn">Take Photo (uses selected trade)</button>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
<div id="photos"></div>
</div>

<div class="section">
<h2>🎤 Voice Notes</h2>
<button id="startBtn">Start Recording</button>
<button id="stopBtn" disabled>Stop</button>
<div id="notes"></div>
</div>

<div class="section">
<h2>✅ Punch List</h2>
<input type="text" id="punchInput" placeholder="Add issue... e.g. Missing outlet cover in master bath">
<button id="addPunchBtn" class="orange">Add to Punch List</button>
<div id="punchList"></div>
</div>

<div class="section" id="reportSection">
<h2>📋 Report</h2>
<button id="genBtn" class="green">Generate Report (Photos + Trades + Punch List)</button>
<button id="printBtn" class="gray">Print Report</button>
<div id="report"></div>
</div>
</div>

<script>
let photos = []; // {src, trade, time}
let notes = [];
let punch = [];
let mediaRec, audioChunks = [];

// Trade select stays sticky
const tradeSelect = document.getElementById('tradeSelect');

window.startWalk = function() {
  const status = document.getElementById('walkStatus');
  status.className = 'status info';
  status.textContent = 'Starting...';
  document.getElementById('photoInput').click();
  setTimeout(function(){ document.getElementById('startBtn').click(); }, 700);
  status.className = 'status ok';
  status.textContent = '🔴 Walk active — take photos & speak notes.';
};
document.getElementById('walkBtn').addEventListener('click', window.startWalk);

window.takePhoto = function() {
  document.getElementById('photoInput').click();
};
document.getElementById('photoBtn').addEventListener('click', window.takePhoto);

document.getElementById('photoInput').addEventListener('change', function(e) {
  const files = e.target.files;
  if (!files || !files.length) return;
  const trade = tradeSelect.value;
  for (let f of files) {
    const r = new FileReader();
    r.onload = function(ev) {
      const item = { src: ev.target.result, trade: trade, time: new Date().toLocaleString() };
      photos.push(item);
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = '<img src="' + item.src + '"><span class="trade-tag">' + item.trade + '</span>';
      document.getElementById('photos').appendChild(card);
      document.getElementById('walkStatus').className = 'status ok';
      document.getElementById('walkStatus').textContent = 'Photo tagged as ' + trade + ' (' + photos.length + ' total)';
    };
    r.readAsDataURL(f);
  }
  e.target.value = '';
});

// Voice
window.startVoice = function() {
  const status = document.getElementById('walkStatus');
  if (!navigator.mediaDevices) {
    status.className = 'status err';
    status.textContent = 'Mic not supported';
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    mediaRec = new MediaRecorder(stream);
    audioChunks = [];
    mediaRec.ondataavailable = function(e){ audioChunks.push(e.data); };
    mediaRec.onstop = function() {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      const div = document.createElement('div');
      div.innerHTML = '<audio controls src="' + url + '"></audio>';
      document.getElementById('notes').appendChild(div);
      notes.push({ url: url, time: new Date().toLocaleString() });
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRec.start();
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    status.className = 'status ok';
    status.textContent = '🔴 Recording voice...';
  }).catch(function(err) {
    status.className = 'status err';
    status.textContent = 'Mic blocked: ' + (err.message || err.name);
  });
};
document.getElementById('startBtn').addEventListener('click', window.startVoice);

window.stopVoice = function() {
  if (mediaRec && mediaRec.state !== 'inactive') {
    mediaRec.stop();
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  }
};
document.getElementById('stopBtn').addEventListener('click', window.stopVoice);

// Punch list
document.getElementById('addPunchBtn').addEventListener('click', function() {
  const val = document.getElementById('punchInput').value.trim();
  if (!val) return;
  punch.push(val);
  const div = document.createElement('div');
  div.className = 'punch-item';
  div.textContent = '• ' + val;
  document.getElementById('punchList').appendChild(div);
  document.getElementById('punchInput').value = '';
});

// Generate report with photos grouped by trade
window.generateReport = function() {
  const trades = {};
  photos.forEach(p => {
    if (!trades[p.trade]) trades[p.trade] = [];
    trades[p.trade].push(p);
  });

  let html = '<div style="text-align:center;margin-bottom:16px">';
  html += '<strong style="font-size:18px">SiteWalk Report</strong><br>';
  html += '<span style="font-size:12px;color:#666">' + new Date().toLocaleString() + '</span></div>';

  // Photos by trade
  const order = ['Plumbing','Electrical','Framing','Drywall','Roofing','Concrete','Landscaping','General','Other'];
  order.forEach(t => {
    if (!trades[t] || !trades[t].length) return;
    html += '<div class="report-section"><h3>' + t + ' (' + trades[t].length + ')</h3>';
    trades[t].forEach(p => {
      html += '<img src="' + p.src + '"><div style="font-size:11px;color:#666;margin-bottom:8px">' + p.time + '</div>';
    });
    html += '</div>';
  });

  // Any leftover trades
  Object.keys(trades).forEach(t => {
    if (order.indexOf(t) === -1) {
      html += '<div class="report-section"><h3>' + t + ' (' + trades[t].length + ')</h3>';
      trades[t].forEach(p => {
        html += '<img src="' + p.src + '"><div style="font-size:11px;color:#666;margin-bottom:8px">' + p.time + '</div>';
      });
      html += '</div>';
    }
  });

  // Punch list
  if (punch.length) {
    html += '<div class="report-section"><h3>Punch List</h3>';
    punch.forEach(item => {
      html += '<div class="punch-item">☐ ' + item + '</div>';
    });
    html += '</div>';
  }

  // Notes count
  html += '<div class="report-section" style="border:none"><h3>Summary</h3>';
  html += 'Photos: ' + photos.length + '<br>';
  html += 'Voice notes: ' + notes.length + '<br>';
  html += 'Punch items: ' + punch.length + '</div>';

  document.getElementById('report').innerHTML = html;
};
document.getElementById('genBtn').addEventListener('click', window.generateReport);

document.getElementById('printBtn').addEventListener('click', function() {
  window.generateReport();
  setTimeout(function(){ window.print(); }, 300);
});

window.addEventListener('load', function() {
  document.getElementById('walkStatus').textContent = 'Ready. Select trade, then take photos.';
});
</script>
</body>
</html>
