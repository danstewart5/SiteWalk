<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SiteWalk</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 0 auto; padding: 12px; background: #f0f2f5; color: #1a1a1a; }
.container { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
h1 { color: #1a365d; margin: 0 0 4px 0; font-size: 22px; }
.subtitle { color: #666; font-size: 13px; margin-bottom: 16px; }
.section { margin: 12px 0; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fafafa; }
h2 { margin: 0 0 10px 0; font-size: 16px; color: #2d3748; }
button { background: #2b6cb0; color: white; border: none; padding: 13px 16px; border-radius: 8px; font-size: 15px; margin: 5px 0; cursor: pointer; width: 100%; }
button:active { opacity: 0.85; }
button:disabled { background: #a0aec0; }
button.green { background: #38a169; }
button.orange { background: #dd6b20; }
button.gray { background: #718096; }
button.red { background: #e53e3e; }
.status { padding: 10px; border-radius: 6px; margin: 8px 0; font-size: 13px; }
.status.ok { background: #c6f6d5; color: #276749; }
.status.err { background: #fed7d7; color: #c53030; }
.status.info { background: #ebf8ff; color: #2b6cb0; }
select, input[type=text], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; margin: 6px 0; }
.photo-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; margin: 8px 0; }
.photo-card img { max-width: 100%; border-radius: 6px; display: block; }
.trade-tag { display: inline-block; background: #2b6cb0; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
.note-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin: 8px 0; font-size: 14px; }
.note-card .meta { font-size: 11px; color: #666; margin-top: 4px; }
.note-card audio { width: 100%; margin-top: 8px; }
.interim { opacity: 0.6; font-style: italic; }
#report { background: white; padding: 16px; border-radius: 8px; margin-top: 12px; border: 1px solid #e2e8f0; }
.report-section { margin: 16px 0; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
.report-section h3 { margin: 0 0 8px 0; color: #1a365d; font-size: 15px; }
.report-section img { max-width: 100%; border-radius: 6px; margin: 6px 0; }
.punch-item { padding: 6px 0; border-bottom: 1px dashed #e2e8f0; font-size: 14px; }
#cameraPreview { width: 100%; border-radius: 8px; background: #000; display: none; margin: 8px 0; }
.cam-actions { display: flex; gap: 8px; }
.cam-actions button { margin: 0; }
#bigWalkBtn { font-size: 20px; padding: 22px 16px; }
@media print {
  body { background: white; padding: 0; }
  .container { box-shadow: none; }
  button, .section:not(#reportSection), #walkStatus, .subtitle, #cameraPreview, .cam-actions, #bigWalkBtn { display: none !important; }
  #reportSection { display: block !important; border: none; }
}
</style>
</head>
<body>
<div class="container">
<h1>📍 SiteWalk</h1>
<p class="subtitle">Walk • Talk • Snap • Report by Trade</p>

<div class="section">
<h2>🎥 Walk-Around</h2>
<button id="bigWalkBtn" class="green">Start Walk</button>
<div id="walkStatus" class="status info">Ready. Tap to begin.</div>
</div>

<div class="section">
<h2>📷 Photos + Trade Tag</h2>
<select id="tradeSelect">
  <option value="General">General</option>
  <option value="Plumbing">Plumbing</option>
  <option value="Electrical">Electrical</option>
  <option value="Framing">Framing</option>
  <option value="Drywall">Drywall</option>
  <option value="Roofing">Roofing</option>
  <option value="Concrete">Concrete</option>
  <option value="Landscaping">Landscaping</option>
  <option value="Other">Other</option>
</select>
<div class="cam-actions">
  <button id="cameraBtn">Open Camera</button>
  <button id="photoBtn" class="gray">Upload Photo</button>
</div>
<video id="cameraPreview" autoplay playsinline></video>
<div class="cam-actions" id="captureActions" style="display:none">
  <button id="captureBtn" class="green">Capture</button>
  <button id="closeCamBtn" class="red">Close</button>
</div>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
<div id="photos"></div>
</div>

<div class="section">
<h2>🎤 Voice Notes</h2>
<button id="startBtn">Start Recording</button>
<button id="stopBtn" disabled>Stop</button>
<div id="liveTranscript" class="note-card interim" style="display:none"></div>
<div id="notes"></div>
</div>

<div class="section">
<h2>✅ Punch List</h2>
<input type="text" id="punchInput" placeholder="Add issue... e.g. Missing outlet cover in master bath">
<button id="addPunchBtn" class="orange">Add to Punch List</button>
<div id="punchList"></div>
</div>

<div class="section" id="reportSection">
<h2>📋 Report</h2>
<button id="genBtn" class="green">Generate Report (Photos + Trades + Punch List)</button>
<button id="printBtn" class="gray">Print Report</button>
<div id="report"></div>
</div>
</div>

<script>
let photos = [];
let notes = [];
let punch = [];
let mediaRec, audioChunks = [];
let voiceSession = null;
let pendingAudioUrl = '';
let cameraStream = null;
let walkActive = false;

const tradeSelect = document.getElementById('tradeSelect');
const TRADE_ORDER = ['Plumbing','Electrical','Framing','Drywall','Roofing','Concrete','Landscaping','General','Other'];
const STORE_KEY = 'sitewalk_v1';

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>')
    .replace(/"/g, '"');
}

function setStatus(msg, kind) {
  const el = document.getElementById('walkStatus');
  el.className = 'status ' + (kind || 'info');
  el.textContent = msg;
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      photos: photos,
      notes: notes.map(function(n){ return { text: n.text, trade: n.trade, time: n.time }; }),
      punch: punch
    }));
  } catch (e) {
    console.warn('Could not save state', e);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    photos = data.photos || [];
    notes = data.notes || [];
    punch = data.punch || [];
    renderPhotos();
    renderNotes();
    renderPunch();
  } catch (e) {
    console.warn('Could not load state', e);
  }
}

function renderPhotos() {
  const box = document.getElementById('photos');
  box.innerHTML = photos.map(function(p, i) {
    return '<div class="photo-card"><img src="' + p.src + '"><span class="trade-tag">' + escapeHtml(p.trade) + '</span><div class="meta">' + escapeHtml(p.time) + '</div></div>';
  }).join('');
}

function renderNotes() {
  const box = document.getElementById('notes');
  box.innerHTML = notes.map(function(n) {
    const text = n.text ? escapeHtml(n.text) : '<span class="interim">Audio only — no transcript</span>';
    const audio = n.url ? '<audio controls src="' + n.url + '"></audio>' : '';
    return '<div class="note-card"><span class="trade-tag">' + escapeHtml(n.trade || 'General') + '</span> ' +
      text + '<div class="meta">' + escapeHtml(n.time || '') + '</div>' + audio + '</div>';
  }).join('');
}

function renderPunch() {
  const box = document.getElementById('punchList');
  box.innerHTML = punch.map(function(item) {
    return '<div class="punch-item">• ' + escapeHtml(item) + '</div>';
  }).join('');
}

const FATAL_STT_ERRORS = {
  'not-allowed': 1,
  'service-not-allowed': 1,
  'audio-capture': 1,
  'language-not-supported': 1
};

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function sttSupported() {
  return 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
}

function createVoiceNoteSession(opts) {
  opts = opts || {};
  const lang = opts.lang || 'en-US';
  const onTranscript = opts.onTranscript;
  const onStatus = opts.onStatus;
  const getMeta = opts.getMeta;
  const pauseMs = opts.pauseMs || 1800;

  if (!sttSupported()) {
    if (onStatus) onStatus('Live captions not supported in this browser. Audio will still record. Try Chrome on Android.', 'info');
    return null;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.lang = lang;
  recognition.continuous = !isIOS;

  let listening = false;
  let starting = false;
  let sessionFinal = '';
  let sessionNotes = [];
  let current = '';
  let lastFinalAt = 0;
  let restartTimer = null;

  function meta() {
    return typeof getMeta === 'function' ? (getMeta() || {}) : {};
  }

  function flushNote() {
    const text = current.trim();
    if (!text) return;
    const m = meta();
    sessionNotes.push({
      text: text,
      time: new Date().toLocaleString(),
      trade: m.trade || 'General'
    });
    current = '';
  }

  function emit(interim) {
    if (onTranscript) onTranscript(sessionFinal, interim || '', sessionNotes.slice());
  }

  function safeStart() {
    if (!listening || starting) return;
    starting = true;
    try {
      recognition.start();
    } catch (err) {
      if (!/already started/i.test(String(err))) {
        if (onStatus) onStatus('Could not restart mic: ' + err.message, 'err');
      }
    } finally {
      starting = false;
    }
  }

  recognition.onresult = function(event) {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const piece = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        const now = Date.now();
        if (current && lastFinalAt && now - lastFinalAt > pauseMs) flushNote();
        current += (current ? ' ' : '') + piece.trim();
        sessionFinal += piece + ' ';
        lastFinalAt = now;
      } else {
        interim += piece;
      }
    }
    emit(interim);
  };

  recognition.onerror = function(event) {
    const err = event.error;
    if (err === 'no-speech' || err === 'aborted') return;
    if (FATAL_STT_ERRORS[err]) {
      listening = false;
      const msg = err === 'not-allowed'
        ? 'Mic permission blocked. Enable microphone for this site.'
        : 'Speech recognition stopped: ' + err;
      if (onStatus) onStatus(msg, 'err');
      return;
    }
    if (onStatus) onStatus('Speech hiccup (' + err + ') — still listening.', 'info');
  };

  recognition.onend = function() {
    if (!listening) return;
    clearTimeout(restartTimer);
    restartTimer = setTimeout(safeStart, isIOS ? 220 : 120);
  };

  return {
    start: function() {
      if (listening) return;
      listening = true;
      sessionFinal = '';
      current = '';
      sessionNotes = [];
      lastFinalAt = 0;
      if (onStatus) onStatus('Listening — walk and talk.', 'ok');
      safeStart();
    },
    stop: function() {
      listening = false;
      clearTimeout(restartTimer);
      flushNote();
      try { recognition.stop(); } catch (e) {}
      emit('');
      if (onStatus) onStatus('Voice note stopped.', 'info');
      return sessionNotes.slice();
    },
    isListening: function() { return listening; }
  };
}

voiceSession = createVoiceNoteSession({
  getMeta: function() { return { trade: tradeSelect.value }; },
  onStatus: setStatus,
  onTranscript: function(finalText, interim) {
    const live = document.getElementById('liveTranscript');
    if (interim) {
      live.style.display = 'block';
      live.textContent = interim;
    } else {
      live.style.display = 'none';
      live.textContent = '';
    }
  }
});

function addPhoto(src, trade) {
  const item = { src: src, trade: trade || tradeSelect.value, time: new Date().toLocaleString() };
  photos.push(item);
  saveState();
  renderPhotos();
  setStatus('Photo tagged as ' + item.trade + ' (' + photos.length + ' total)', 'ok');
}

async function openCamera() {
  const preview = document.getElementById('cameraPreview');
  const captureActions = document.getElementById('captureActions');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('Camera API not available. Using file upload instead.', 'info');
    document.getElementById('photoInput').click();
    return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    preview.srcObject = cameraStream;
    preview.style.display = 'block';
    captureActions.style.display = 'flex';
    setStatus('Camera open. Frame the shot and tap Capture.', 'ok');
  } catch (err) {
    setStatus('Camera blocked or unavailable: ' + (err.message || err.name) + '. Falling back to upload.', 'err');
    document.getElementById('photoInput').click();
  }
}

function capturePhoto() {
  const preview = document.getElementById('cameraPreview');
  if (!preview.videoWidth) {
    setStatus('Camera not ready yet.', 'err');
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = preview.videoWidth;
  canvas.height = preview.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  addPhoto(dataUrl, tradeSelect.value);
  closeCamera();
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(function(t) { t.stop(); });
    cameraStream = null;
  }
  const preview = document.getElementById('cameraPreview');
  preview.srcObject = null;
  preview.style.display = 'none';
  document.getElementById('captureActions').style.display = 'none';
}

document.getElementById('cameraBtn').addEventListener('click', openCamera);
document.getElementById('captureBtn').addEventListener('click', capturePhoto);
document.getElementById('closeCamBtn').addEventListener('click', closeCamera);

document.getElementById('photoBtn').addEventListener('click', function() {
  document.getElementById('photoInput').click();
});

document.getElementById('photoInput').addEventListener('change', function(e) {
  const files = e.target.files;
  if (!files || !files.length) return;
  const trade = tradeSelect.value;
  for (let f of files) {
    const r = new FileReader();
    r.onload = function(ev) {
      addPhoto(ev.target.result, trade);
    };
    r.readAsDataURL(f);
  }
  e.target.value = '';
});

window.startVoice = function() {
  if (mediaRec && mediaRec.state === 'recording') return;
  if (!navigator.mediaDevices) {
    setStatus('Mic not supported', 'err');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    let options = {};
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
      options.mimeType = 'audio/webm;codecs=opus';
    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
      options.mimeType = 'audio/mp4';
    }
    try {
      mediaRec = new MediaRecorder(stream, options);
    } catch (e) {
      mediaRec = new MediaRecorder(stream);
    }
    audioChunks = [];
    mediaRec.ondataavailable = function(e) { audioChunks.push(e.data); };
    mediaRec.onstop = function() {
      const blob = new Blob(audioChunks, { type: mediaRec.mimeType || 'audio/webm' });
      pendingAudioUrl = URL.createObjectURL(blob);
      stream.getTracks().forEach(function(t) { t.stop(); });
      attachAudioToLatestNotes();
      renderNotes();
      saveState();
    };
    mediaRec.start();
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    setStatus('Recording voice...', 'ok');
    if (voiceSession) voiceSession.start();
  }).catch(function(err) {
    setStatus('Mic blocked: ' + (err.message || err.name), 'err');
  });
};
document.getElementById('startBtn').addEventListener('click', window.startVoice);

function attachAudioToLatestNotes() {
  if (!pendingAudioUrl) return;
  const withoutAudio = notes.filter(function(n) { return !n.url; });
  if (withoutAudio.length) {
    withoutAudio.forEach(function(n) { n.url = pendingAudioUrl; });
  } else {
    notes.push({
      text: '',
      trade: tradeSelect.value,
      time: new Date().toLocaleString(),
      url: pendingAudioUrl
    });
  }
  pendingAudioUrl = '';
}

window.stopVoice = function() {
  let transcribed = [];
  if (voiceSession && voiceSession.isListening()) {
    transcribed = voiceSession.stop() || [];
  }
  transcribed.forEach(function(n) { notes.push(n); });
  renderNotes();
  saveState();
  document.getElementById('liveTranscript').style.display = 'none';

  if (mediaRec && mediaRec.state !== 'inactive') {
    mediaRec.stop();
  }
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
};
document.getElementById('stopBtn').addEventListener('click', window.stopVoice);

document.getElementById('addPunchBtn').addEventListener('click', function() {
  const val = document.getElementById('punchInput').value.trim();
  if (!val) return;
  punch.push(val);
  saveState();
  renderPunch();
  document.getElementById('punchInput').value = '';
  setStatus('Added to punch list.', 'ok');
});

window.generateReport = function() {
  const photoTrades = {};
  photos.forEach(function(p) {
    if (!photoTrades[p.trade]) photoTrades[p.trade] = [];
    photoTrades[p.trade].push(p);
  });

  const noteTrades = {};
  notes.forEach(function(n) {
    const t = n.trade || 'General';
    if (!noteTrades[t]) noteTrades[t] = [];
    noteTrades[t].push(n);
  });

  const allTrades = {};
  TRADE_ORDER.concat(Object.keys(photoTrades), Object.keys(noteTrades)).forEach(function(t) {
    allTrades[t] = true;
  });

  let html = '<div style="text-align:center;margin-bottom:16px">';
  html += '<strong style="font-size:18px">SiteWalk Report</strong><br>';
  html += '<span style="font-size:12px;color:#666">' + escapeHtml(new Date().toLocaleString()) + '</span></div>';

  function renderTrade(t) {
    const pList = photoTrades[t] || [];
    const nList = noteTrades[t] || [];
    if (!pList.length && !nList.length) return;
    html += '<div class="report-section"><h3>' + escapeHtml(t) + ' (' + pList.length + ' photo' + (pList.length === 1 ? '' : 's') + ')</h3>';
    pList.forEach(function(p) {
      html += '<img src="' + p.src + '"><div style="font-size:11px;color:#666;margin-bottom:8px">' + escapeHtml(p.time) + '</div>';
    });
    nList.forEach(function(n) {
      if (!n.text) return;
      html += '<div class="punch-item">' + escapeHtml(n.text) +
        '<div style="font-size:11px;color:#666">' + escapeHtml(n.time) + '</div></div>';
    });
    html += '</div>';
  }

  TRADE_ORDER.forEach(renderTrade);
  Object.keys(allTrades).forEach(function(t) {
    if (TRADE_ORDER.indexOf(t) === -1) renderTrade(t);
  });

  if (punch.length) {
    html += '<div class="report-section"><h3>Punch List</h3>';
    punch.forEach(function(item) {
      html += '<div class="punch-item">• ' + escapeHtml(item) + '</div>';
    });
    html += '</div>';
  }

  html += '<div class="report-section"><h3>Summary</h3>';
  html += '<div class="punch-item">Photos: ' + photos.length + '</div>';
  html += '<div class="punch-item">Voice notes: ' + notes.length + '</div>';
  html += '<div class="punch-item">Punch items: ' + punch.length + '</div>';
  html += '</div>';

  document.getElementById('report').innerHTML = html;
  setStatus('Report generated.', 'ok');
};
document.getElementById('genBtn').addEventListener('click', window.generateReport);

document.getElementById('printBtn').addEventListener('click', function() {
  window.generateReport();
  setTimeout(function() { window.print(); }, 100);
});

async function startWalk() {
  if (walkActive) {
    await stopWalk();
    return;
  }
  walkActive = true;
  const btn = document.getElementById('bigWalkBtn');
  btn.textContent = 'Stop Walk';
  btn.classList.remove('green');
  btn.classList.add('red');
  setStatus('Walk started — camera and mic are ready. Talk and snap as you go.', 'ok');
  try {
    await openCamera();
  } catch (e) {}
  try {
    window.startVoice();
  } catch (e) {}
}

async function stopWalk() {
  walkActive = false;
  const btn = document.getElementById('bigWalkBtn');
  btn.textContent = 'Start Walk';
  btn.classList.remove('red');
  btn.classList.add('green');
  closeCamera();
  window.stopVoice();
  setStatus('Walk stopped. Data saved.', 'info');
}

document.getElementById('bigWalkBtn').addEventListener('click', startWalk);

window.addEventListener('load', function() {
  loadState();
  setStatus(sttSupported()
    ? 'Ready. Tap Start Walk to begin.'
    : 'Ready. Live captions unavailable — audio recording still works.', 'info');
});

window.addEventListener('beforeunload', function() {
  if (cameraStream) closeCamera();
});
</script>
</body>
</html>
